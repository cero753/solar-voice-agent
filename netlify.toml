[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy the browser call to the serverless function (keeps ELEVENLABS_API_KEY server-side)
[[redirects]]
  from = "/api/signed-url"
  to = "/.netlify/functions/signed-url"
  status = 200

# SPA fallback for react-router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
